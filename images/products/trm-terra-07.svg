<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a12" />
      <stop offset="50%" stop-color="#050d09" />
      <stop offset="100%" stop-color="#020503" />
    </linearGradient>
    <radialGradient id="greenGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a29" />
      <stop offset="50%" stop-color="#14281c" />
      <stop offset="100%" stop-color="#0a150e" />
    </linearGradient>
    <pattern id="gripPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="none" stroke="#2e5c3e" stroke-width="1" />
    </pattern>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad7)" />
  <circle cx="400" cy="300" r="280" fill="url(#greenGlow2)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <g filter="url(#shadow7)">
    <!-- Partially Unrolled Mat Body (Isometric Plane) -->
    <polygon points="260,240 680,240 540,460 120,460" fill="url(#matGrad)" stroke="#10b981" stroke-width="3" />
    <polygon points="260,240 680,240 540,460 120,460" fill="url(#gripPattern)" />

    <!-- Center Alignment Line & Stance Markers -->
    <line x1="470" y1="240" x2="330" y2="460" stroke="#34d399" stroke-width="2.5" stroke-dasharray="14 8" opacity="0.8" />
    <!-- 45-degree Alignment Angles -->
    <line x1="380" y1="330" x2="440" y2="330" stroke="#34d399" stroke-width="2" opacity="0.6" />
    <line x1="330" y1="410" x2="390" y2="410" stroke="#34d399" stroke-width="2" opacity="0.6" />

    <!-- Rolled End Cylinder (Left Edge) -->
    <path d="M 220 200 L 260 240 L 120 460 L 80 420 Z" fill="#0f2117" stroke="#10b981" stroke-width="2" />
    <ellipse cx="100" cy="440" rx="36" ry="18" fill="#14281c" stroke="#34d399" stroke-width="2.5" transform="rotate(-35 100 440)" />
    <ellipse cx="240" cy="220" rx="36" ry="18" fill="#14281c" stroke="#34d399" stroke-width="2.5" transform="rotate(-35 240 220)" />

    <!-- Woven Compression Harness Straps & Buckles -->
    <!-- Strap 1 -->
    <path d="M 140 250 L 170 290" stroke="#111827" stroke-width="12" />
    <rect x="146" y="260" width="18" height="18" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="2" transform="rotate(40 155 269)" />

    <!-- Strap 2 -->
    <path d="M 200 340 L 230 380" stroke="#111827" stroke-width="12" />
    <rect x="206" y="350" width="18" height="18" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="2" transform="rotate(40 215 359)" />

    <!-- Embossed Aether Logo / Badge -->
    <polygon points="480,380 500,350 520,380" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7" />
    <text x="500" y="405" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle" letter-spacing="2">AETHER // 6MM</text>
  </g>

  <!-- Technical Spec Labels -->
  <g font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1.5">
    <text x="40" y="550">AETHER // FIT-007</text>
    <text x="40" y="570">HIGH-DENSITY DUAL-GRIP &#183; 6MM</text>
    <text x="610" y="550" text-anchor="end">TERRA RECOVERY MAT</text>
    <text x="610" y="570" text-anchor="end" fill="#10b981">LASER ALIGNMENT &#183; MIL-SPEC HARNESS</text>
  </g>
</svg>