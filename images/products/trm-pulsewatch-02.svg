<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a12" />
      <stop offset="50%" stop-color="#050d09" />
      <stop offset="100%" stop-color="#020503" />
    </linearGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1b5e20" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2826" />
      <stop offset="50%" stop-color="#2d3b36" />
      <stop offset="100%" stop-color="#1c2826" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad2)" />
  <circle cx="400" cy="300" r="260" fill="url(#greenGlow)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <g filter="url(#shadow2)">
    <!-- Watch Strap Top -->
    <path d="M 330 40 L 470 40 L 450 170 L 350 170 Z" fill="url(#strapGrad)" stroke="#111827" stroke-width="4" />
    <!-- Top Strap Ridges -->
    <line x1="335" y1="70" x2="465" y2="70" stroke="#111827" stroke-width="4" />
    <line x1="340" y1="100" x2="460" y2="100" stroke="#111827" stroke-width="4" />
    <line x1="345" y1="130" x2="455" y2="130" stroke="#111827" stroke-width="4" />

    <!-- Watch Strap Bottom -->
    <path d="M 350 430 L 450 430 L 470 560 L 330 560 Z" fill="url(#strapGrad)" stroke="#111827" stroke-width="4" />
    <!-- Bottom Strap Ridges -->
    <line x1="345" y1="470" x2="455" y2="470" stroke="#111827" stroke-width="4" />
    <line x1="340" y1="500" x2="460" y2="500" stroke="#111827" stroke-width="4" />
    <line x1="335" y1="530" x2="465" y2="530" stroke="#111827" stroke-width="4" />

    <!-- Outer Octagonal Tactical Bezel -->
    <polygon points="340,170 460,170 530,240 530,360 460,430 340,430 270,360 270,240" fill="url(#bezelGrad)" stroke="#374151" stroke-width="8" />
    <!-- Bezel Screws -->
    <circle cx="340" cy="178" r="4" fill="#9ca3af" />
    <circle cx="460" cy="178" r="4" fill="#9ca3af" />
    <circle cx="522" cy="240" r="4" fill="#9ca3af" />
    <circle cx="522" cy="360" r="4" fill="#9ca3af" />
    <circle cx="460" cy="422" r="4" fill="#9ca3af" />
    <circle cx="340" cy="422" r="4" fill="#9ca3af" />
    <circle cx="278" cy="360" r="4" fill="#9ca3af" />
    <circle cx="278" cy="240" r="4" fill="#9ca3af" />

    <!-- Right Guard / Pushers -->
    <rect x="532" y="270" width="14" height="24" rx="3" fill="#374151" stroke="#111827" stroke-width="2" />
    <rect x="532" y="310" width="14" height="24" rx="3" fill="#374151" stroke="#111827" stroke-width="2" />

    <!-- Dial Base -->
    <circle cx="400" cy="300" r="115" fill="#040a07" stroke="#1b5e20" stroke-width="4" />
    <circle cx="400" cy="300" r="105" fill="#020503" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Telemetry Screen Graphics -->
    <!-- Time display -->
    <text x="400" y="275" font-family="monospace" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">14:52</text>
    <text x="400" y="295" font-family="monospace" font-size="12" fill="#00e676" text-anchor="middle" letter-spacing="3">GPS LOCK // 23°N 85°E</text>

    <!-- Pulse Wave ECG -->
    <path d="M 310 330 L 340 330 L 350 315 L 360 345 L 375 305 L 390 350 L 400 330 L 430 330 L 440 318 L 450 340 L 460 330 L 490 330" fill="none" stroke="#00e676" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Biometrics indicators -->
    <g font-family="monospace" font-size="11" fill="#94a3b8">
      <text x="340" y="375" text-anchor="middle">HR <tspan fill="#ff5252" font-weight="bold">72</tspan> BPM</text>
      <text x="460" y="375" text-anchor="middle">SpO2 <tspan fill="#00e5ff" font-weight="bold">99%</tspan></text>
    </g>

    <!-- Outer Battery Ring Arc -->
    <path d="M 320 230 A 105 105 0 0 1 480 230" fill="none" stroke="#00e676" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Technical Spec Labels -->
  <g font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1.5">
    <text x="40" y="550">AETHER // WRD-002</text>
    <text x="40" y="570">MIL-STD-810H &#183; 90-DAY POWER</text>
    <text x="610" y="550" text-anchor="end">PULSE SENTINEL</text>
    <text x="610" y="570" text-anchor="end" fill="#00e676">BIOMETRIC FIELD TELEMETRY</text>
  </g>
</svg>