<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="50%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="blueGlow8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="knobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#475569" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad8)" />
  <circle cx="400" cy="300" r="280" fill="url(#blueGlow8)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <g filter="url(#shadow8)">
    <!-- Aluminum Support Feet -->
    <rect x="180" y="390" width="40" height="16" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <rect x="580" y="390" width="40" height="16" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />

    <!-- Main Anodized Chassis Faceplate -->
    <rect x="140" y="200" width="520" height="200" rx="12" fill="url(#chassisGrad)" stroke="#64748b" stroke-width="3" />
    <!-- Beveled Front Border -->
    <rect x="150" y="210" width="500" height="180" rx="8" fill="#0b111e" stroke="#334155" stroke-width="2" />

    <!-- OLED Status Display (Left Side) -->
    <rect x="180" y="245" width="140" height="70" rx="4" fill="#020617" stroke="#0ea5e9" stroke-width="1.5" />
    <!-- OLED Screen Readout -->
    <text x="195" y="270" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="bold">PCM 384 kHz</text>
    <text x="195" y="290" font-family="monospace" font-size="10" fill="#94a3b8">DSD512 &#183; USB IN</text>
    <text x="195" y="305" font-family="monospace" font-size="9" fill="#0284c7">GAIN: HIGH [2W]</text>

    <!-- Metal Toggle Switch (Center Left) -->
    <circle cx="360" cy="275" r="14" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <line x1="360" y1="275" x2="350" y2="250" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <circle cx="350" cy="250" r="5" fill="#f8fafc" />
    <text x="360" y="305" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">INPUT</text>

    <!-- 4.4mm Balanced Headphone Output Jack -->
    <circle cx="420" cy="275" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <circle cx="420" cy="275" r="7" fill="#020617" />
    <text x="420" y="305" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">4.4mm BAL</text>

    <!-- 6.35mm Single-Ended Output Jack -->
    <circle cx="480" cy="275" r="20" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
    <circle cx="480" cy="275" r="10" fill="#020617" />
    <text x="480" y="305" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">6.35mm SE</text>

    <!-- Massive Solid Aluminum Volume Knob (Right Side) -->
    <circle cx="580" cy="280" r="52" fill="url(#knobGrad)" stroke="#cbd5e1" stroke-width="3" />
    <!-- Knurled Outer Ring Pattern -->
    <circle cx="580" cy="280" r="46" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="4 2" />
    <!-- Inner Recessed Cap -->
    <circle cx="580" cy="280" r="38" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- White Volume Notch Indicator Line -->
    <line x1="580" y1="244" x2="580" y2="258" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <text x="580" y="350" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">VOLUME</text>
  </g>

  <!-- Technical Spec Labels -->
  <g font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1.5">
    <text x="40" y="550">AETHER // AUD-008</text>
    <text x="40" y="570">ESS SABRE &#183; 32-BIT/384KHZ &#183; 2W CLASS</text>
    <text x="610" y="550" text-anchor="end">SIGNAL DAC AMP</text>
    <text x="610" y="570" text-anchor="end" fill="#0ea5e9">DISCRETE ANALOG STAGE &#183; 4.4MM BAL</text>
  </g>
</svg>