<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1324" />
      <stop offset="50%" stop-color="#060c17" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="meshPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#475569" opacity="0.6" />
    </pattern>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad5)" />
  <circle cx="400" cy="300" r="280" fill="url(#cyanGlow)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Sound Waves Emanating from Base -->
  <ellipse cx="400" cy="460" rx="220" ry="40" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" stroke-dasharray="12 8" />
  <ellipse cx="400" cy="460" rx="280" ry="50" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" stroke-dasharray="16 12" />

  <g filter="url(#shadow5)">
    <!-- Base Waveguide Foot -->
    <path d="M 310 430 Q 400 450 490 430 L 500 460 Q 400 484 300 460 Z" fill="#020617" stroke="#0ea5e9" stroke-width="2" />

    <!-- Speaker Cylindrical Mesh Body -->
    <path d="M 310 160 L 490 160 L 490 430 Q 400 450 310 430 Z" fill="url(#cylinderGrad)" stroke="#334155" stroke-width="3" />
    <path d="M 310 160 L 490 160 L 490 430 Q 400 450 310 430 Z" fill="url(#meshPattern)" />

    <!-- Vertical Accent Seam Strip -->
    <line x1="400" y1="160" x2="400" y2="440" stroke="#0ea5e9" stroke-width="2" opacity="0.7" />

    <!-- Top Cap Rim -->
    <ellipse cx="400" cy="160" rx="90" ry="24" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <ellipse cx="400" cy="156" rx="84" ry="20" fill="#090d16" stroke="#0ea5e9" stroke-width="1.5" />

    <!-- Top Cap Control Icons -->
    <circle cx="360" cy="156" r="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="360" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text>

    <circle cx="400" cy="156" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="397,151 405,156 397,161" fill="#ffffff" />

    <circle cx="440" cy="156" r="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="440" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <!-- Glowing Base Ring -->
    <ellipse cx="400" cy="440" rx="88" ry="18" fill="none" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Technical Spec Labels -->
  <g font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1.5">
    <text x="40" y="550">AETHER // AUD-005</text>
    <text x="40" y="570">360° PHASE-COHERENT &#183; IP67 SEALED</text>
    <text x="610" y="550" text-anchor="end">RESONANCE SPEAKER</text>
    <text x="610" y="570" text-anchor="end" fill="#38bdf8">24H BATTERY &#183; DISTRIBUTED AUDIO</text>
  </g>
</svg>